# Large-scale production run for H1 (frozen fraction f_N vs N).
# 11 N values: 10,000 to 20,000 in steps of 1,000. Changed 2026-09-13
# from the previous 4-point geometric grid (10K-10M) per researcher
# request. Uses the rolling-window estimator (definition B, method 1 /
# self-scaling patience burn-in, locked in 2026-09-13).
#
# DO NOT RUN without first estimating cost (runtime/memory) and getting
# explicit approval, per CLAUDE.md's inviolable rules.

model:
  density: 0.5
  boundary_condition: periodic

N_values: [10000, 11000, 12000, 13000, 14000, 15000, 16000, 17000, 18000, 19000, 20000]

estimator: rolling

patience_multiplier: 20
max_steps_multiplier: 10

rolling:
  W_multiplier: 5
  M: 10
  c_selfscale: 5
  max_extra_windows: 200

ensemble:
  target_relative_se: 0.01
  min_samples: 20
  batch_size: 20
  max_samples_per_N: 5000

master_seed: 20260914
