# Quick check parameters for H2 (active-region/gap-length distribution)
# - run this before any production gap-length config. See H2 in
# HYPOTHESES.md for the definitions of gap length, patience_multiplier,
# max_steps_multiplier, W_multiplier, c_selfscale.
#
# Reuses H1's locked-in rolling-window self-scaling burn-in (2026-09-13)
# but takes a single post-burn-in snapshot per realization (no M -- H2
# doesn't average multiple measurement windows, per researcher choice
# 2026-09-14). Zero-length gaps are discarded from the pooled
# distribution (researcher instruction, 2026-09-14).

model:
  density: 0.5
  boundary_condition: periodic

L_values: [100, 200, 400, 800]

patience_multiplier: 20      # initial coarse burn-in: patience = patience_multiplier * L
max_steps_multiplier: 10     # safety cap on that coarse stage

rolling:
  W_multiplier: 5             # measurement window W = W_multiplier * L
  c_selfscale: 5              # self-scaling burn-in: extend until (t-G) >= c_selfscale * G
  max_extra_windows: 200      # safety cap on the self-scaling extension

ensemble:
  target_relative_se: 0.10    # looser than production - quick check only
  min_samples: 20
  batch_size: 20
  max_samples_per_N: 200

master_seed: 12345
