# Production run for H2 (active-region/gap-length distribution vs L).
# 8 doubling L values from 100 to 12,800, matching H2's stated range in
# HYPOTHESES.md. Reuses H1's locked-in rolling-window self-scaling
# burn-in (W_multiplier=5, c_selfscale=5, max_extra_windows=200,
# 2026-09-13) but takes a single post-burn-in snapshot per realization
# (no M) and discards zero-length gaps from the pooled distribution
# (both per researcher choice, 2026-09-14).
#
# DO NOT RUN without first estimating cost (runtime/memory) and getting
# explicit approval, per CLAUDE.md's inviolable rules.

model:
  density: 0.5
  boundary_condition: periodic

L_values: [100, 200, 400, 800, 1600, 3200, 6400, 12800]

patience_multiplier: 20
max_steps_multiplier: 10

rolling:
  W_multiplier: 5
  c_selfscale: 5
  max_extra_windows: 200

ensemble:
  target_relative_se: 0.01
  min_samples: 20
  batch_size: 20
  max_samples_per_N: 5000

master_seed: 20260914
